require:
  - ./app/lib/rubocop/cop/custom_cops/common_sense

AllCops:
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'db/**/*'
    - 'config.ru'
    - 'config/**/*'
    - 'script/**/*'
    - 'bin/setup'
    - 'bin/**'
    - 'bin/{rails,rake}'
    - 'spec/spec_helper.rb'
    - 'spec/rails_helper.rb'

Style/StringLiterals:
  Enabled: false

Style/Documentation:
  Enabled: false

CustomCops/CommonSense:
  Enabled: true
  Exclude:
    - './app/lib/rubocop/cop/custom_cops/common_sense.rb'
